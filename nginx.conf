server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed JS/CSS bundles never change
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Game assets (sprites, maps, audio) are not hashed
    location /assets/ {
        expires 1d;
        try_files $uri =404;
    }

    # Single-page app: unknown paths (/landing, /killingGame) serve index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
